openapi: 3.1.0
info:
  title: Plugin Management API
  version: 1.0.0
  description: API for managing plugins (agents and skills) in SunnyAgent

servers:
  - url: /api
    description: API prefix

tags:
  - name: plugins
    description: Plugin management operations
  - name: ratings
    description: Plugin rating operations

paths:
  /plugins:
    get:
      operationId: listPlugins
      summary: List all available plugins
      description: |
        Returns all plugins visible to the current user:
        - Preset plugins (built-in)
        - Package plugins (from packages/ directory)
        - Uploaded plugins (user's own uploads)
        - Shared plugins (shared by other users)
      tags:
        - plugins
      parameters:
        - name: source
          in: query
          schema:
            type: string
            enum: [preset, package, uploaded, shared]
          description: Filter by source type
        - name: type
          in: query
          schema:
            type: string
            enum: [agent, skill]
          description: Filter by plugin type
        - name: enabled
          in: query
          schema:
            type: boolean
          description: Filter by enabled status
        - name: search
          in: query
          schema:
            type: string
          description: Search in name and description
      responses:
        "200":
          description: List of plugins
          content:
            application/json:
              schema:
                type: object
                properties:
                  plugins:
                    type: array
                    items:
                      $ref: "#/components/schemas/PluginInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /plugins/{plugin_name}:
    get:
      operationId: getPlugin
      summary: Get plugin details
      tags:
        - plugins
      parameters:
        - name: plugin_name
          in: path
          required: true
          schema:
            type: string
          description: Plugin name in namespace format (e.g., "preset:research")
      responses:
        "200":
          description: Plugin details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginInfo"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updatePluginState
      summary: Update plugin enabled state
      tags:
        - plugins
      parameters:
        - name: plugin_name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginStateUpdateRequest"
      responses:
        "200":
          description: Updated plugin state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginInfo"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deletePlugin
      summary: Delete uploaded plugin
      description: Only uploaded plugins owned by the user can be deleted
      tags:
        - plugins
      parameters:
        - name: plugin_name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Plugin deleted
        "403":
          description: Cannot delete - plugin is shared or not owned
        "404":
          $ref: "#/components/responses/NotFound"

  /plugins/upload:
    post:
      operationId: uploadPlugin
      summary: Upload a new plugin package
      description: |
        Upload a ZIP file containing plugin definition.
        Must include AGENTS.md (for agent) or SKILL.md (for skill).
      tags:
        - plugins
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: ZIP file containing plugin
              required:
                - file
      responses:
        "201":
          description: Plugin uploaded and registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginUploadResponse"
        "400":
          description: Invalid plugin package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Plugin with same name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /plugins/{plugin_name}/share:
    post:
      operationId: sharePlugin
      summary: Share plugin to marketplace
      description: Make an uploaded plugin visible to all users
      tags:
        - plugins
      parameters:
        - name: plugin_name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plugin shared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginInfo"
        "403":
          description: Cannot share - not the owner
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: unsharePlugin
      summary: Unshare plugin from marketplace
      description: Remove plugin from public visibility (existing users keep access)
      tags:
        - plugins
      parameters:
        - name: plugin_name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plugin unshared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginInfo"
        "403":
          description: Cannot unshare - not the owner
        "404":
          $ref: "#/components/responses/NotFound"

  /plugins/{plugin_name}/rating:
    get:
      operationId: getPluginRating
      summary: Get plugin rating summary
      tags:
        - ratings
      parameters:
        - name: plugin_name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rating summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginRatingInfo"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: ratePlugin
      summary: Rate a plugin
      description: Only Package and Shared plugins can be rated
      tags:
        - ratings
      parameters:
        - name: plugin_name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginRatingRequest"
      responses:
        "200":
          description: Rating saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginRatingInfo"
        "400":
          description: Cannot rate this plugin type
        "404":
          $ref: "#/components/responses/NotFound"

  /plugins/marketplace:
    get:
      operationId: browseMarketplace
      summary: Browse plugin marketplace
      description: List all publicly available plugins (Preset, Package, Shared)
      tags:
        - plugins
      parameters:
        - name: source
          in: query
          schema:
            type: string
            enum: [preset, package, shared]
          description: Filter by source
        - name: search
          in: query
          schema:
            type: string
          description: Search query
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, rating, recent]
            default: name
          description: Sort order
      responses:
        "200":
          description: Marketplace plugins
          content:
            application/json:
              schema:
                type: object
                properties:
                  plugins:
                    type: array
                    items:
                      $ref: "#/components/schemas/PluginInfo"

components:
  schemas:
    PluginInfo:
      type: object
      required:
        - name
        - display_name
        - type
        - source
        - description
        - version
        - enabled
      properties:
        name:
          type: string
          description: Namespaced name (e.g., "preset:research")
        display_name:
          type: string
        type:
          type: string
          enum: [agent, skill]
        source:
          type: string
          enum: [preset, package, uploaded, shared]
        description:
          type: string
        version:
          type: string
        author:
          type: string
        enabled:
          type: boolean
        capabilities:
          type: array
          items:
            type: string
          description: Agent capabilities
        commands:
          type: array
          items:
            type: string
          description: Available /commands
        skills:
          type: array
          items:
            $ref: "#/components/schemas/PluginInfo"
          description: Nested skills (for agents)
        skill_type:
          type: string
          enum: [atomic, workflow]
        steps:
          type: array
          items:
            $ref: "#/components/schemas/SkillStepInfo"
        rating:
          $ref: "#/components/schemas/PluginRatingInfo"
        uploader_id:
          type: string
          format: uuid
        uploader_name:
          type: string
        is_delisted:
          type: boolean

    SkillStepInfo:
      type: object
      required:
        - id
        - description
      properties:
        id:
          type: string
        description:
          type: string
        required_capability:
          type: string

    PluginRatingInfo:
      type: object
      required:
        - average
        - count
      properties:
        average:
          type: number
          format: float
          minimum: 0
          maximum: 5
        count:
          type: integer
          minimum: 0

    PluginStateUpdateRequest:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean

    PluginRatingRequest:
      type: object
      required:
        - rating
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5

    PluginUploadResponse:
      type: object
      required:
        - plugin
        - message
      properties:
        plugin:
          $ref: "#/components/schemas/PluginInfo"
        message:
          type: string

    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token

security:
  - cookieAuth: []
